# ==============================================================================
# CarePulse Enterprise HMS - PostgreSQL Cloud Profile (Render)
# ==============================================================================

# ------------------------------------------------------------------------------
# Datasource Configuration (PostgreSQL)
# When DATABASE_URL is provided by Render, DatabaseConfig.java parses it dynamically.
# These fallback properties are used if DATABASE_URL is not set or parsed directly.
# ------------------------------------------------------------------------------
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hospital_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Hikari Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=CarePulseHikariPool

# ------------------------------------------------------------------------------
# JPA & Hibernate Configuration
# ------------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ------------------------------------------------------------------------------
# Flyway Database Migrations
# Note: Existing migrations are T-SQL / MSSQL specific.
# In the postgres profile, Flyway is disabled in favor of JPA auto-DDL and DataInitializer.
# ------------------------------------------------------------------------------
spring.flyway.enabled=false

# ------------------------------------------------------------------------------
# CORS Allowed Origins
# ------------------------------------------------------------------------------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,https://*.onrender.com}
