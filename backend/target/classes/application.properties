# ==============================================================================
# CarePulse Enterprise HMS - Application Configuration
# ==============================================================================
spring.application.name=hospital-app
server.port=8085

# ------------------------------------------------------------------------------
# Microsoft SQL Server Datasource Configuration
# ------------------------------------------------------------------------------
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=hospital_db;encrypt=true;trustServerCertificate=true
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=sa
spring.datasource.password=YourStrongPassword123

# Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000

# ------------------------------------------------------------------------------
# JPA & Hibernate Configuration
# Schema is strictly version-controlled via Flyway; ddl-auto must remain none
# ------------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.open-in-view=false

# ------------------------------------------------------------------------------
# Flyway Database Migrations
# ------------------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# ------------------------------------------------------------------------------
# JWT Security Token Properties
# Base64 encoded 256-bit secret key for HMAC-SHA256
# ------------------------------------------------------------------------------
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=86400000

# CORS Allowed Origins
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173
